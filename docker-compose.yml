services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped

    ports:
      - "8554:8554"     # RTSP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC
      - "8892:8892"     # WebRTC
      - "8189:8189/udp" # WebRTC ICE
      - "1935:1935"     # RTMP
      - "8890:8890"     # SRT
      - "9997:9997"     # API
      - "9998:9998"     # API
      - "9999:9999"     # API

    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
